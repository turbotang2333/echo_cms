name: Release Echo PH2 referral

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - run: python scripts/manifest.py deploy/app.yml

  release:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install manifest validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Validate deployment manifest
        id: manifest
        run: python scripts/manifest.py --github-output "$GITHUB_OUTPUT" deploy/app.yml
      - name: Build image
        id: build
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          APP_ID: ${{ steps.manifest.outputs.app_id }}
        run: |
          IMAGE_TAG="$ACR_REGISTRY/$ACR_NAMESPACE/$APP_ID:${GITHUB_SHA}"
          docker build --pull --tag "$IMAGE_TAG" .
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
      - name: Push immutable image
        id: push
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          IMAGE_TAG: ${{ steps.build.outputs.image_tag }}
        run: |
          printf '%s' "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" --username "$ACR_USERNAME" --password-stdin
          docker push "$IMAGE_TAG"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_TAG")"
          test -n "$DIGEST"
          echo "image_digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Configure strict deployment SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
      - name: Transfer Compose definition
        env:
          APP_ID: ${{ steps.manifest.outputs.app_id }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes deploy/compose.production.yml "$DEPLOY_USER@$DEPLOY_HOST:/opt/apps/release-inbox/$APP_ID-${GITHUB_SHA}.yml"
      - name: Activate release
        env:
          APP_ID: ${{ steps.manifest.outputs.app_id }}
          DOMAIN: ${{ steps.manifest.outputs.domain }}
          PATH_PREFIX: ${{ steps.manifest.outputs.path_prefix }}
          INTERNAL_PORT: ${{ steps.manifest.outputs.internal_port }}
          HEALTH_PATH: ${{ steps.manifest.outputs.health_path }}
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          SOURCE="/opt/apps/release-inbox/$APP_ID-${GITHUB_SHA}.yml"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            sudo /usr/local/bin/deploy-app --app "$APP_ID" --image "$IMAGE_DIGEST" --domain "$DOMAIN" --path-prefix "$PATH_PREFIX" --port "$INTERNAL_PORT" --health-path "$HEALTH_PATH" --source "$SOURCE"
