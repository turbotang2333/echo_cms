name: Release Echo PH2 referral

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - run: python scripts/manifest.py deploy/app.yml

  release:
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: read
      id-token: write
    uses: turbotang2333/deploy-infra/.github/workflows/reusable-release.yml@33e44a3d263303de0e62b2bd5a14146c1b8f48c1
    with:
      manifest-path: deploy/app.yml
    secrets:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
